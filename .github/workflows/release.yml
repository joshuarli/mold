name: release

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build:
    name: Build (${{ matrix.arch }}-linux-musl)
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    permissions:
      contents: read
    defaults:
      run:
        shell: bash -euo pipefail {0}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Podman
        run: sudo apt-get update && sudo apt-get install -y podman
      # dist.sh builds inside an Alpine container and writes
      # dist/mold-<version>-<arch>-linux-musl.tar.gz.
      - name: Build
        run: ./dist.sh ${{ matrix.arch }}-musl
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mold-${{ matrix.arch }}-linux-musl
          path: dist/mold-*-linux-musl.tar.gz
          if-no-files-found: error

  release:
    name: Create pre-release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: mold-*-linux-musl
          path: dist
          merge-multiple: true
      - name: Generate checksums
        run: cd dist && sha256sum -- *.tar.gz > checksums
      - name: Create pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          tag="mold-musl-${version}-${GITHUB_SHA::7}"
          gh release create "$tag" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$tag" \
            --prerelease \
            --notes ""
